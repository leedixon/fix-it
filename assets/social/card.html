<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fix Listed — social card</title>
<!--
  The source for public/assets/social/*.png.

  Rendered rather than drawn, so the card uses the site's real typefaces and
  the same tokens as the stylesheet. A wordmark set in the actual Marcellus
  beats one traced by hand or produced by an image generator, which cannot
  spell reliably at any size.

  Re-render with:  node assets/social/render.js
  The fonts are vendored next to this file so it renders with no network.
-->
<style>
  @font-face { font-family:"Marcellus";      src:url("fonts/marcellus-400.woff2")  format("woff2"); font-weight:400 }
  @font-face { font-family:"Hanken Grotesk"; src:url("fonts/hanken-400.woff2")     format("woff2"); font-weight:400 }
  @font-face { font-family:"Hanken Grotesk"; src:url("fonts/hanken-600.woff2")     format("woff2"); font-weight:600 }
  @font-face { font-family:"IBM Plex Mono";  src:url("fonts/plex-mono-500.woff2")  format("woff2"); font-weight:500 }

  :root{
    --ink:#0E1513; --ink-2:#18221F;
    --on-ink:#E9EEE9; --on-ink-2:#9AA8A2; --on-ink-line:#2C3B36;
    --brass:#C79A3E; --brass-3:#DCB25C;
    --jade:#6BB39D;
    --serif:"Marcellus",Georgia,serif;
    --sans:"Hanken Grotesk",-apple-system,Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000}

  .card{
    position:relative; overflow:hidden;
    background:var(--ink); color:var(--on-ink);
    font-family:var(--sans);
    display:flex; flex-direction:column;
  }
  /* The hero's own glow, so the card and the site look like one thing. */
  .card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 84% 4%, rgba(199,154,62,.20), transparent 58%);
  }
  .card > *{position:relative; z-index:1}

  /* ---- the plumb bob ----
     A trade tool that is also the promise: plumb means true. Line art in
     brass, large but low contrast, so it reads as texture at thumbnail size
     and as a drawn object at full size. */
  .bob{position:absolute; right:var(--bob-right); top:0; z-index:0; opacity:.5}

  .inner{flex:1; display:flex; flex-direction:column; justify-content:center; gap:var(--gap)}

  .eyebrow{
    font-family:var(--mono); font-weight:500; color:var(--brass-3);
    text-transform:uppercase; letter-spacing:.2em; font-size:var(--eyebrow);
  }
  .mark{font-family:var(--serif); font-size:var(--mark); line-height:1; letter-spacing:.01em}
  .mark .b{color:var(--on-ink)}
  .mark .i{color:var(--brass-3)}

  .line{width:var(--rule); height:2px; background:var(--brass); opacity:.9}

  .claim{
    font-family:var(--serif); font-size:var(--claim); line-height:1.12;
    letter-spacing:-.01em; max-width:var(--claim-w); text-wrap:balance;
  }
  .claim em{font-style:italic; color:var(--brass-3)}

  .facts{display:flex; gap:var(--fact-gap); flex-wrap:wrap; align-items:center}
  .fact{display:flex; align-items:center; gap:8px; color:var(--on-ink-2); font-size:var(--fact)}
  .fact svg{color:var(--jade); flex:none}

  .foot{
    border-top:1px solid var(--on-ink-line);
    padding-top:var(--foot-pad);
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    font-family:var(--mono); font-weight:500; font-size:var(--foot);
    letter-spacing:.14em; text-transform:uppercase; color:var(--on-ink-2);
  }
  .foot .price{color:var(--brass-3)}

  /* ---------- 1200x630 — Open Graph, Twitter, LinkedIn ---------- */
  .card.og{
    width:1200px; height:630px; padding:60px 64px 48px;
    --mark:62px; --claim:50px; --claim-w:18ch; --eyebrow:15px;
    --fact:19px; --foot:14px; --rule:78px; --gap:26px;
    --fact-gap:26px; --foot-pad:26px; --bob-right:52px;
  }
  /* ---------- 1080x1080 — Instagram, square previews ---------- */
  .card.sq{
    width:1080px; height:1080px; padding:88px 84px 72px;
    --mark:84px; --claim:68px; --claim-w:14ch; --eyebrow:18px;
    --fact:24px; --foot:17px; --rule:104px; --gap:38px;
    --fact-gap:32px; --foot-pad:34px; --bob-right:44px;
  }
  .card.sq .bob{opacity:.34}

  /* =====================================================================
   * Facebook.
   *
   * These two do NOT share the template above, and that is deliberate. og
   * and square are the same card at two sizes, so one content block is
   * right for them. A profile picture and a cover photo are different
   * things saying different things, and forcing them through one template
   * would mean writing a card that is wrong in both places.
   *
   * What they do share is everything that must not drift: the :root tokens,
   * the typefaces, the glow, the mark.
   * ================================================================== */

  /* ---------- 1080x1080 — the profile picture ----------
   *
   * Facebook crops this to a CIRCLE and shows it as small as 36px in a
   * comment thread. Two consequences drive the whole design.
   *
   * The corners are thrown away, so nothing may live in them.
   *
   * And line art dies. The plumb bob on the cards above is drawn with a
   * 2.4px stroke: scaled to 36px that stroke is a tenth of a pixel and the
   * mark is simply gone. So this one is filled rather than drawn — the same
   * tool, same silhouette, solid brass. It is the only version of the mark
   * that survives the size Facebook actually shows it at.
   *
   * There is no wordmark on it. At 36px no wordmark is readable, and
   * Facebook prints the Page name next to the avatar everywhere it appears
   * anyway. The avatar's job is recognition, not reading.
   */
  .card.fbp{
    width:1080px; height:1080px; padding:0;
    align-items:center; justify-content:center;
  }
  .card.fbp::after{
    background:radial-gradient(70% 70% at 50% 34%, rgba(199,154,62,.26), transparent 62%);
  }
  /* The circle Facebook will cut, drawn as a hairline so the render can be
     checked against it rather than guessed at. Hidden in the output. */
  .card.fbp .ring{
    position:absolute; inset:74px; border-radius:50%;
    border:2px solid var(--brass); opacity:.22;
  }
  /* The body's mass sits below the middle of the svg box, so centring the
     box leaves the mark hanging low in the circle. Shifted up by the
     difference. */
  .card.fbp .bob-solid{position:relative; z-index:2; margin-top:-76px}

  /* ---------- 1640x624 — the cover photo ----------
   *
   * Two crops, one file. Desktop shows the whole 820x312; mobile fills a
   * 640x360 frame, which is a taller shape, so it scales the image up and
   * throws away the sides — roughly a third of the width, split evenly.
   *
   * --safe is the centre band that survives that crop. Everything that has
   * to be read lives inside it; the bob sits at the inner edge of it rather
   * than out in the decorative margin, so the mobile cover is not just text.
   *
   * The bottom strip is kept quiet because the profile picture overlaps the
   * cover there — bottom-left on desktop, lower-centre on mobile. A tagline
   * with an avatar parked on top of it is the commonest way a cover photo
   * goes wrong.
   */
  .card.fbc{
    width:1640px; height:624px; padding:0;
    /* Measured against a rendered mobile crop, not calculated from the
       aspect ratios — the theoretical band left the headline three percent
       from the edge, which reads as a mistake. */
    --safe:960px; --quiet:140px;
  }
  .card.fbc::after{
    background:radial-gradient(90% 150% at 78% 0%, rgba(199,154,62,.22), transparent 60%);
  }
  /*
   * The bob is taken out of the flow rather than sat beside the copy.
   *
   * As a flex sibling it stole 200px from the column and the county line
   * wrapped, leaving "JO DAVIESS" alone on a second row — which reads as a
   * mistake rather than a list. Hung from the top right instead, it ends
   * well above that line, so the counties get the full band and stay on one
   * row. It is decoration; it should not be setting the measure.
   */
  .card.fbc .cover-in{
    position:relative; z-index:1;
    width:var(--safe); margin:0 auto;
    height:calc(100% - var(--quiet));
    display:flex; flex-direction:column; justify-content:center;
  }
  .card.fbc .bob{
    position:absolute; z-index:0; top:0;
    right:calc((100% - var(--safe)) / 2);
  }
  /*
   * Everything below is set at TWICE the size it looks like it should be,
   * and that is not a mistake to tidy up later.
   *
   * This file is 1640 wide and Facebook displays it at 820 — so every value
   * here is halved on screen. Set at what reads correctly in the source,
   * the county line came out around six pixels on a desktop page and the
   * URL was not legible at all. Nothing in the render says so; you only see
   * it by looking at the cover at the size it is actually shown.
   */
  .card.fbc .cover-copy{flex:1; min-width:0}
  .card.fbc .eyebrow{font-size:24px}
  .card.fbc .claim{font-size:76px; max-width:13ch; margin-top:22px}
  .card.fbc .line{margin:30px 0 24px; width:150px; height:3px}
  .card.fbc .where{
    white-space:nowrap;
    font-family:var(--mono); font-weight:500; font-size:21px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--on-ink-2);
  }
  .card.fbc .url{
    font-family:var(--mono); font-weight:500; font-size:26px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--brass-3);
    margin-top:20px;
  }
  .card.fbc .bob{opacity:.55}
</style>
</head>
<body>

<!-- The markup is written once and laid out twice, so the two cards can
     never say different things. -->
<template id="content">
  <svg class="bob" width="240" height="560" viewBox="0 0 240 560" fill="none"
       stroke="#C79A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true">
    <!-- the line it hangs from, running off the top edge -->
    <path d="M96 0v236" stroke-width="1.5" opacity=".75"/>
    <!-- brass cap -->
    <path d="M78 248h36l-8-12H86z" opacity=".9"/>
    <!-- body: a teardrop that comes to a true point, which is the whole
         idea of the tool and the reason it is on this card -->
    <path d="M96 250l40 62c0 60-16 104-40 142-24-38-40-82-40-142z"/>
    <!-- turned bands, so it reads as machined brass rather than a leaf -->
    <path d="M60 318h72" opacity=".5" stroke-width="1.6"/>
    <path d="M64 352h64" opacity=".32" stroke-width="1.6"/>
    <!-- the point, extended as a hairline -->
    <path d="M96 454v40" stroke-width="1.3" opacity=".5"/>
    <!-- a measuring edge, ticks reading like a folding rule -->
    <g opacity=".38" stroke-width="1.6">
      <path d="M196 84h28M196 124h15M196 164h15M196 204h15M196 244h28M196 284h15
               M196 324h15M196 364h15M196 404h28M196 444h15M196 484h15"/>
      <path d="M224 70v428" stroke-width="1.1"/>
    </g>
  </svg>

  <div class="inner">
    <div>
      <div class="eyebrow">Northwest Illinois</div>
      <div class="mark" style="margin-top:12px"><span class="b">Fix</span> <span class="i">Listed</span></div>
    </div>

    <div class="line"></div>

    <h1 class="claim">The trades directory that doesn't take <em>a cut of your job</em>.</h1>

    <div class="facts">
      <span class="fact"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Licence &amp; insurance checked</span>
      <span class="fact"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Free for pros to quote</span>
    </div>
  </div>

  <div class="foot">
    <span>fixlisted.com</span>
    <span class="price">Post a job — $10 flat</span>
  </div>
</template>

<div class="card og" id="og"></div>
<div class="card sq" id="sq"></div>

<!-- ---------- Facebook profile picture ---------- -->
<div class="card fbp" id="fbp">
  <div class="ring"></div>
  <svg class="bob-solid" width="672" height="941" viewBox="0 0 400 560" fill="none" aria-hidden="true">
    <defs>
      <!-- Lit from the left, the way the site's hero glow falls. A gradient
           rather than a drawn highlight: a stroke laid on top reads as a
           stray hair at small sizes, a gradient just reads as metal. -->
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#E8C579"/>
        <stop offset=".38" stop-color="#D5A948"/>
        <stop offset="1"   stop-color="#A97F2C"/>
      </linearGradient>
    </defs>

    <!-- Short. A long line reads as empty space at 36px and drags the
         whole mark off centre; this says "hanging" and stops. -->
    <path d="M200 6v78" stroke="#C79A3E" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <!-- brass cap -->
    <path d="M166 124h68l-15-40h-38z" fill="#DCB25C"/>
    <!-- The body. Wider and shorter than the line-art version on the cards,
         because a slim silhouette closes up into a sliver once Facebook
         scales it into a comment thread. -->
    <path d="M200 120 L344 284 C344 408 298 502 200 590 C102 502 56 408 56 284 Z" fill="url(#brass)"/>
    <!-- Two turned bands, cut in the background colour. Two, not three:
         at 36px a third becomes noise and the thing starts reading as a
         leaf rather than a machined tool. -->
    <path d="M62 336h276" stroke="#0E1513" stroke-width="13" opacity=".34"/>
    <path d="M84 386h232" stroke="#0E1513" stroke-width="10" opacity=".22"/>
  </svg>
</div>

<!-- ---------- Facebook cover photo ---------- -->
<div class="card fbc" id="fbc">
  <div class="cover-in">
    <div class="cover-copy">
      <div class="eyebrow">Northwest Illinois</div>
      <h1 class="claim">Keep the whole job. <em>We take nothing.</em></h1>
      <div class="line"></div>
      <div class="where">Stephenson · Winnebago · Ogle · Boone · Carroll · Jo Daviess</div>
      <div class="url">fixlisted.com</div>
    </div>

    <svg class="bob" width="150" height="330" viewBox="0 0 240 520" fill="none"
         stroke="#C79A3E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <path d="M96 0v206" stroke-width="2.2" opacity=".75"/>
      <path d="M78 218h36l-8-12H86z" opacity=".9"/>
      <path d="M96 220l40 62c0 60-16 104-40 142-24-38-40-82-40-142z"/>
      <path d="M60 288h72" opacity=".5" stroke-width="2.2"/>
      <path d="M64 322h64" opacity=".32" stroke-width="2.2"/>
      <path d="M96 424v44" stroke-width="1.9" opacity=".5"/>
    </svg>
  </div>
</div>

<script>
  // One content block, cloned into both frames.
  const tpl = document.getElementById('content');
  for (const id of ['og', 'sq']) {
    document.getElementById(id).appendChild(tpl.content.cloneNode(true));
  }
</script>
</body>
</html>
